name: kaayansh_boutique_pos
description: Offline-first Boutique POS with Local Wi-Fi Browser Access for Kaayansh Collective.
publish_to: 'none'
version: 1.3.0+4

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  sqflite: ^2.3.0
  path_provider: ^2.1.1
  path: ^1.8.3
  image_picker: ^1.0.4
  intl: ^0.18.1
  pdf: ^3.10.4
  printing: ^5.11.0
  excel: ^4.0.3
  open_file: ^3.3.2
  shelf: ^1.4.1
  shelf_router: ^1.1.4
  network_info_plus: ^5.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/
