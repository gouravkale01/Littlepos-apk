name: LittlePOS V2 APK Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract V2 ZIP
        run: |
          if [ ! -f littlepos-v2-final.zip ]; then
            echo "V2 ZIP not found in repository root"
            exit 1
          fi
          unzip -o littlepos-v2-final.zip -d .
          test -f pubspec.yaml || {
            echo "pubspec.yaml missing after extraction"
            exit 1
          }

      - name: Fix known Dart compile errors
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("lib/screens/billing_screen.dart")
          if p.exists():
              s = p.read_text()
              s = s.replace(
                  "bool get _gst=(_company?['gst_registered'] as int? ?? 0)==1;",
                  "bool get _gst => (_company?['gst_registered'] as int? ?? 0) == 1;"
              )
              s = s.replace(
                  "pw.Padding(padding: const EdgeInsets.all(",
                  "pw.Padding(padding: const pw.EdgeInsets.all("
              )
              p.write_text(s)

          p = Path("lib/screens/dashboard_screen.dart")
          if p.exists():
              s = p.read_text().replace(
                  "pw.Padding(padding: const EdgeInsets.all(",
                  "pw.Padding(padding: const pw.EdgeInsets.all("
              )
              p.write_text(s)
          PY

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android files
        run: flutter create --platforms=android --project-name kaayansh_boutique_pos .

      - name: Set Android compile SDK 36
        shell: bash
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | head -n 1)"
          fi
          if [ ! -x "$SDKMANAGER" ]; then
            echo "Android sdkmanager not found"
            exit 1
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-36"
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path("android/app/build.gradle.kts")
          if p.exists():
              s = p.read_text()
              s, n = re.subn(r'compileSdk\s*=\s*[^\n]+', 'compileSdk = 36', s, count=1)
              if not n:
                  s = s.replace('android {', 'android {\n    compileSdk = 36', 1)
              p.write_text(s)
          else:
              p = Path("android/app/build.gradle")
              if not p.exists():
                  raise SystemExit("Android app Gradle file not found")
              s = p.read_text()
              s, n = re.subn(r'compileSdk(?:Version)?\s+[^\n]+', 'compileSdkVersion 36', s, count=1)
              if not n:
                  s = s.replace('android {', 'android {\n    compileSdkVersion 36', 1)
              p.write_text(s)
          PY

      - name: Add Android permissions
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("android/app/src/main/AndroidManifest.xml")
          s = p.read_text()
          permissions = [
              '<uses-permission android:name="android.permission.CAMERA"/>',
              '<uses-permission android:name="android.permission.BLUETOOTH" android:maxSdkVersion="30"/>',
              '<uses-permission android:name="android.permission.BLUETOOTH_ADMIN" android:maxSdkVersion="30"/>',
              '<uses-permission android:name="android.permission.BLUETOOTH_CONNECT"/>',
              '<uses-permission android:name="android.permission.BLUETOOTH_SCAN" android:usesPermissionFlags="neverForLocation"/>'
          ]
          marker = '<application'
          if marker not in s:
              raise SystemExit("Android application tag missing")
          for item in permissions:
              if item.split('"')[1] not in s:
                  s = s.replace(marker, '    ' + item + '\\n    ' + marker, 1)
          p.write_text(s)
          PY

      - name: Install dependencies
        run: flutter pub get

      - name: Disable problematic lintVital tasks
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("android/build.gradle")
          if not p.exists():
              p = Path("android/build.gradle.kts")
          if not p.exists():
              raise SystemExit("Gradle file not found")
          p.write_text(p.read_text() + """
          
          subprojects {
              afterEvaluate { subproject ->
                  def androidExtension = subproject.extensions.findByName("android")
                  if (androidExtension != null) {
                      androidExtension.compileSdkVersion(36)
                  }
              }
              tasks.configureEach {
                  if (name.startsWith("lintVital")) {
                      enabled = false
                  }
              }
          }
          """)
          PY

      - name: Build Release APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LittlePOS-V2-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
