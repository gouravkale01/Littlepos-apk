name: LittlePOS V2 APK Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract V2 ZIP
        run: |
          if [ ! -f littlepos-v2-final.zip ]; then
            echo "V2 ZIP not found in repository root"
            exit 1
          fi
          unzip -o littlepos-v2-final.zip -d .
          test -f pubspec.yaml || {
            echo "pubspec.yaml missing after extraction"
            exit 1
          }

      - name: Inspect V2 UI source
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          for p in sorted(Path("lib").rglob("*.dart")):
              print("\\n===== SOURCE:", p, "=====")
              text = p.read_text(errors="replace")
              print(text[:18000])
          PY

      - name: Fix known Dart compile errors
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path("lib/screens/billing_screen.dart")
          if p.exists():
              s = p.read_text()
              s, n = re.subn(r"bool get _gst\\s*=\\s*(.*?);", r"bool get _gst => \\1;", s)
              if n == 0 and "bool get _gst =>" not in s:
                  raise SystemExit("Could not repair GST getter in billing_screen.dart")
              p.write_text(s)

          p = Path("lib/screens/dashboard_screen.dart")
          if p.exists():
              s = p.read_text().replace(
                  "pw.Padding(padding: const EdgeInsets.",
                  "pw.Padding(padding: const pw.EdgeInsets."
              )
              p.write_text(s)
          PY

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android files
        run: flutter create --platforms=android --project-name kaayansh_boutique_pos .

      - name: Set Android compile SDK 36
        shell: bash
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | head -n 1)"
          fi
          if [ ! -x "$SDKMANAGER" ]; then
            echo "Android sdkmanager not found"
            exit 1
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-36"
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path("android/app/build.gradle.kts")
          if p.exists():
              s = p.read_text()
              s, n = re.subn(r'compileSdk\\s*=\\s*[^\\n]+', 'compileSdk = 36', s, count=1)
              if not n:
                  s = s.replace('android {', 'android {\n    compileSdk = 36', 1)
              p.write_text(s)
          else:
              p = Path("android/app/build.gradle")
              if not p.exists():
                  raise SystemExit("Android app Gradle file not found")
              s = p.read_text()
              s, n = re.subn(r'compileSdk(?:Version)?\\s+[^\\n]+', 'compileSdkVersion 36', s, count=1)
              if not n:
                  s = s.replace('android {', 'android {\\n    compileSdkVersion 36', 1)
              p.write_text(s)
          PY

      - name: Add Android permissions
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("android/app/src/main/AndroidManifest.xml")
          s = p.read_text()
          permissions = [
              '<uses-permission android:name="android.permission.CAMERA"/>',
              '<uses-permission android:name="android.permission.BLUETOOTH" android:maxSdkVersion="30"/>',
              '<uses-permission android:name="android.permission.BLUETOOTH_ADMIN" android:maxSdkVersion="30"/>',
              '<uses-permission android:name="android.permission.BLUETOOTH_CONNECT"/>',
              '<uses-permission android:name="android.permission.BLUETOOTH_SCAN" android:usesPermissionFlags="neverForLocation"/>'
          ]
          marker = '<application'
          if marker not in s:
              raise SystemExit("Android application tag missing")
          for item in permissions:
              if item.split('"')[1] not in s:
                  s = s.replace(marker, '    ' + item + '\\n    ' + marker, 1)
          p.write_text(s)
          PY

      - name: Install dependencies
        run: flutter pub get

      - name: Set every Flutter plugin compile SDK to 36
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          cache = Path.home() / ".pub-cache" / "hosted" / "pub.dev"
          required = {"file_picker", "flutter_plugin_android_lifecycle"}
          changed = []
          found = set()

          for gradle_file in cache.glob("*/android/build.gradle*"):
              package = gradle_file.parent.parent.name.rsplit("-", 1)[0]
              if package not in required and "compileSdk" not in gradle_file.read_text(errors="ignore"):
                  continue

              original = gradle_file.read_text()
              lines = original.splitlines()
              updated = []
              touched = False

              for line in lines:
                  stripped = line.strip()
                  if "compileSdk" in stripped and not stripped.startswith("//"):
                      indent = line[:len(line) - len(line.lstrip())]
                      if stripped.startswith("compileSdkVersion"):
                          line = indent + "compileSdkVersion 36"
                          touched = True
                      elif stripped.startswith("compileSdk"):
                          line = indent + "compileSdk = 36"
                          touched = True
                  updated.append(line)

              if touched:
                  gradle_file.write_text("\\n".join(updated) + "\\n")
                  changed.append(str(gradle_file))
                  found.add(package)

          print("Patched Gradle files:", changed)
          missing = required - found
          if missing:
              raise SystemExit("Could not patch required plugin(s): " + ", ".join(sorted(missing)))
          PY

      - name: Install required Android CMake
        shell: bash
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | head -n 1)"
          fi
          if [ -z "$SDKMANAGER" ]; then
            echo "Android sdkmanager not found"
            exit 1
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "cmake;3.22.1"
          test -d "$ANDROID_HOME/cmake/3.22.1" || {
            echo "CMake 3.22.1 installation was not completed"
            exit 1
          }

      - name: Configure permanent Android release signing
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [ -z "${!name:-}" ]; then
              echo "Missing GitHub Actions secret: $name"
              exit 1
            fi
          done
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/littlepos-upload.jks
          python3 - <<'PY'
          from pathlib import Path
          p = Path("android/app/build.gradle.kts")
          s = p.read_text()
          if 'signingConfigs.create("release")' in s:
              raise SystemExit("Release signing already configured; refusing duplicate patch")
          start = s.find("android {")
          if start < 0:
              raise SystemExit("android block missing")
          depth = 0
          quote = None
          escaped = False
          end = None
          for i in range(start + len("android "), len(s)):
              ch = s[i]
              if quote:
                  if escaped: escaped = False
                  elif ch == "\\\\": escaped = True
                  elif ch == quote: quote = None
                  continue
              if ch in ('"', "'"): quote = ch
              elif ch == "{": depth += 1
              elif ch == "}":
                  depth -= 1
                  if depth == 0:
                      end = i
                      break
          if end is None:
              raise SystemExit("Could not locate end of android block")
          signing = '''
              signingConfigs {
                  create("release") {
                      storeFile = file("littlepos-upload.jks")
                      storePassword = System.getenv("ANDROID_KEYSTORE_PASSWORD")
                      keyAlias = System.getenv("ANDROID_KEY_ALIAS")
                      keyPassword = System.getenv("ANDROID_KEY_PASSWORD")
                  }
              }
              buildTypes {
                  getByName("release") {
                      signingConfig = signingConfigs.getByName("release")
                  }
              }
          '''
          p.write_text(s[:end] + signing + s[end:])
          PY

      - name: Build Release APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LittlePOS-V2-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
