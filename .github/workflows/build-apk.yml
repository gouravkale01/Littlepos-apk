
name: Build LittlePOS APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Extract LittlePOS ZIP
        shell: bash
        run: |
          set -e

          ZIP_FILE=$(find . -maxdepth 1 -type f -iname '*.zip' | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: LittlePOS ZIP not found in repository root"
            exit 1
          fi

          mkdir -p _source
          unzip -q "$ZIP_FILE" -d _source

          PUBSPEC=$(find _source -name pubspec.yaml -type f | head -n 1)

          if [ -z "$PUBSPEC" ]; then
            echo "ERROR: pubspec.yaml not found inside ZIP"
            exit 1
          fi

          APP_DIR=$(dirname "$PUBSPEC")
          cp -a "$APP_DIR"/. .

          if [ ! -f pubspec.yaml ]; then
            echo "ERROR: Project files were not copied"
            exit 1
          fi

      - name: Generate fresh Android project
        shell: bash
        run: |
          set -e

          rm -rf android

          flutter create \
            --platforms=android \
            --org com.kaayansh.littlepos \
            .

      - name: Disable crashing Android release lint tasks
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          groovy = Path("android/build.gradle")
          kotlin = Path("android/build.gradle.kts")

          if groovy.exists():
              with groovy.open("a") as f:
                  f.write("""
          
          subprojects {
              tasks.configureEach {
                  if (name.startsWith("lintVital")) {
                      enabled = false
                  }
              }
          }
          """)
          elif kotlin.exists():
              with kotlin.open("a") as f:
                  f.write("""
          
          subprojects {
              tasks.configureEach {
                  if (name.startsWith("lintVital")) {
                      enabled = false
                  }
              }
          }
          """)
          else:
              raise SystemExit("Android root Gradle file not found")
          PY
          
      - name: Configure local network permissions
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path("android/app/src/main/AndroidManifest.xml")
          s = p.read_text()

          permissions = [
              "android.permission.INTERNET",
              "android.permission.ACCESS_NETWORK_STATE",
              "android.permission.ACCESS_WIFI_STATE",
          ]

          for permission in permissions:
              if permission not in s:
                  s = s.replace(
                      "<application",
                      f'<uses-permission android:name="{permission}" />\n    <application',
                      1
                  )

          if "android:usesCleartextTraffic" not in s:
              s = s.replace(
                  "<application",
                  '<application android:usesCleartextTraffic="true"',
                  1
              )

          p.write_text(s)
          PY

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Check Flutter project
        run: flutter analyze --no-pub
        continue-on-error: true

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LittlePOS-Android-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 7
          
