name: LittlePOS Browser Preview

on:
  push:
    branches:
      - browser-preview
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: littlepos-browser-preview
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout browser preview branch
        uses: actions/checkout@v4

      - name: Extract V2 app source
        run: |
          unzip -o littlepos-v2-final.zip -d .
          test -f pubspec.yaml
          test -d lib

      - name: Configure browser database
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path("pubspec.yaml")
          s = p.read_text()
          if "sqflite_common_ffi_web:" not in s:
              s = re.sub(r"(?m)^dependencies:\s*$", "dependencies:\n  sqflite_common_ffi_web: ^0.4.5+4", s, count=1)
          p.write_text(s)
          p = Path("lib/main.dart")
          s = p.read_text()
          if "sqflite_common_ffi_web/sqflite_ffi_web.dart" not in s:
              s = s.replace("import 'package:flutter/material.dart';",
                  "import 'package:flutter/material.dart';\n"
                  "import 'package:flutter/foundation.dart';\n"
                  "import 'package:sqflite/sqflite.dart' as sqflite;\n"
                  "import 'package:sqflite_common_ffi_web/sqflite_ffi_web.dart';")
          s = s.replace("  await DatabaseHelper.instance.database;",
              "  if (kIsWeb) {\n"
              "    sqflite.databaseFactory = databaseFactoryFfiWeb;\n"
              "  }\n"
              "  // Initialize the database lazily after the login UI is mounted.\n")
          p.write_text(s)
          # Force portrait orientation on native Android, but never call this channel on web.
          p = Path("lib/main.dart")
          s = p.read_text()
          if "package:flutter/services.dart" not in s:
              s = s.replace("import 'package:flutter/material.dart';",
                  "import 'package:flutter/material.dart';\nimport 'package:flutter/services.dart';")
          if "SystemChrome.setPreferredOrientations" not in s:
              s = s.replace("  WidgetsFlutterBinding.ensureInitialized();",
                  "  WidgetsFlutterBinding.ensureInitialized();\n"
                  "  if (!kIsWeb) {\n"
                  "    await SystemChrome.setPreferredOrientations([DeviceOrientation.portraitUp]);\n"
                  "  }")
          p.write_text(s)
          # path_provider's documents directory is unavailable in browsers.
          # Keep the native Android path unchanged; web SQLite uses a database name.
          p = Path("lib/database/db_helper.dart")
          s = p.read_text()
          if "package:flutter/foundation.dart" not in s:
              s = s.replace("import 'dart:io';", "import 'dart:io';\nimport 'package:flutter/foundation.dart';")
          # Adapt the original V2 database initializer for browser SQLite and native paths.
          # The V2 archive uses "final dir" and an inline openDatabase(join(...)).
          pattern = re.compile(
              r"final\s+dir\s*=\s*await\s+getApplicationDocumentsDirectory\(\)\s*;\s*return\s+openDatabase\(join\(dir\.path\s*,\s*filePath\)\s*,"
          )
          replacement = "final dir = kIsWeb ? null : await getApplicationDocumentsDirectory();\n    return openDatabase(kIsWeb ? filePath : join(dir!.path, filePath),"
          s, count = pattern.subn(lambda m: replacement, s, count=1)
          if count == 0 and "openDatabase(kIsWeb ? filePath" not in s:
              print("===== UNMATCHED db_helper.dart =====")
              print(s)
              raise SystemExit("Could not identify V2 database initializer")
          s = s.replace(
              "  Future<String> getImagesDirectory() async {",
              "  Future<String> getImagesDirectory() async {\n    if (kIsWeb) return '';",
              1
          )
          s = s.replace(
              "  Future<String> databaseFilePath() async { final dir=await getApplicationDocumentsDirectory();",
              "  Future<String> databaseFilePath() async { if (kIsWeb) return ''; final dir=await getApplicationDocumentsDirectory();",
              1
          )
          p.write_text(s)
          PY

      - name: Repair Dart source for browser compilation
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("lib/screens/billing_screen.dart")
          if p.exists():
              lines = p.read_text().splitlines()
              lines = [line.replace("bool get _gst=", "bool get _gst => ", 1) if "bool get _gst=" in line else line for line in lines]
              p.write_text("\n".join(lines) + "\n")
          p = Path("lib/screens/dashboard_screen.dart")
          if p.exists():
              s = p.read_text().replace("pw.Padding(padding: const EdgeInsets.", "pw.Padding(padding: const pw.EdgeInsets.")
              p.write_text(s)
          PY

      - name: Inspect browser startup and database code
        shell: bash
        run: |
          echo "===== lib/main.dart ====="
          sed -n '1,220p' lib/main.dart
          echo "===== lib/database/db_helper.dart ====="
          sed -n '1,260p' lib/database/db_helper.dart
          echo "===== database-related source files ====="
          find lib -type f | grep -Ei 'database|db|helper' || true
          echo "===== database calls and configuration ====="
          grep -R -n -E 'openDatabase|DatabaseHelper|databaseFactory|singleInstance|path_provider|getDatabasesPath' lib | head -160 || true

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate web platform files
        run: flutter create --platforms=web --project-name kaayansh_boutique_pos .

      - name: Install dependencies
        run: flutter pub get

      - name: Prepare SQLite WebAssembly and worker
        run: dart run sqflite_common_ffi_web:setup

      - name: Build browser preview
        run: flutter build web --release --no-wasm-dry-run --base-href "/Littlepos-apk/"

      - name: Browser runtime smoke test
        shell: bash
        run: |
          mkdir -p /tmp/littlepos-www/Littlepos-apk
          cp -a build/web/. /tmp/littlepos-www/Littlepos-apk/
          python3 -m http.server 4173 --directory /tmp/littlepos-www > /tmp/littlepos-http.log 2>&1 &
          echo $! > /tmp/littlepos-http.pid
          npm install --no-save playwright
          npx playwright install --with-deps chromium
          cat > /tmp/littlepos-smoke.cjs <<'JS'
          const { chromium } = require('playwright');
          (async () => {
            const browser = await chromium.launch({headless:true});
            const page = await browser.newPage();
            const errors = [];
            page.on('pageerror', e => { errors.push(e); console.error('PAGE_ERROR_MESSAGE:', e.message); console.error('PAGE_ERROR_STACK:', e.stack); });
            page.on('console', m => { if (m.type() === 'error') { console.error('CONSOLE_ERROR:', m.text()); errors.push(new Error(m.text())); } });
            page.on('requestfailed', r => { console.error('REQUEST_FAILED:', r.url(), r.failure()?.errorText); errors.push(new Error('Request failed: '+r.url())); });
            page.on('response', r => { if (r.status() >= 400) console.error('HTTP_ERROR:', r.status(), r.url()); });
            const response = await page.goto('http://127.0.0.1:4173/Littlepos-apk/', {waitUntil:'domcontentloaded', timeout:30000});
            await page.waitForTimeout(10000);
            const result = await page.evaluate(() => ({title:document.title, bodyText:document.body.innerText, canvases:document.querySelectorAll('flt-glass-pane,canvas').length, html:document.body.innerHTML.slice(0,1500)}));
            console.log('SMOKE_HTTP_STATUS:', response?.status());
            console.log('SMOKE_PAGE_RESULT:', JSON.stringify(result));
            await page.screenshot({path:'/tmp/littlepos-browser.png', fullPage:true});
            console.log('SMOKE_ERROR_COUNT:', errors.length);
            await browser.close();
            if (!response || !response.ok() || errors.length > 0 || (!result.bodyText.trim() && result.canvases === 0)) process.exit(1);
          })().catch(e => { console.error(e); process.exit(1); });
          JS
          NODE_PATH="$GITHUB_WORKSPACE/node_modules" node /tmp/littlepos-smoke.cjs
          kill $(cat /tmp/littlepos-http.pid) || true

      - name: Upload browser diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: LittlePOS-browser-diagnostics
          path: /tmp/littlepos-browser.png
          if-no-files-found: ignore

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload browser build
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

      - name: Wait for Pages artifact registration
        run: sleep 15

      - name: Publish browser preview
        id: deployment
        uses: actions/deploy-pages@v4
