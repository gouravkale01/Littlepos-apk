name: LittlePOS Browser Preview

on:
  push:
    branches:
      - browser-preview
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: littlepos-browser-preview
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout browser preview branch
        uses: actions/checkout@v4

      - name: Extract V2 app source
        run: |
          unzip -o littlepos-v2-final.zip -d .
          test -f pubspec.yaml
          test -d lib

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate web platform files
        run: flutter create --platforms=web --project-name kaayansh_boutique_pos .

      - name: Install dependencies
        run: flutter pub get

      - name: Build browser preview
        run: flutter build web --release --base-href "/Littlepos-apk/"

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload browser build
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

      - name: Publish browser preview
        id: deployment
        uses: actions/deploy-pages@v4
